name: Docs

# Builds the package documentation with the generator behind pkg.odin-lang.org and
# publishes it to GitHub Pages (in the repository settings under Pages, with GitHub Actions
# as the source).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    # Deploying to GitHub Pages needs both.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # odin-lang/pkg.odin-lang.org commit the generator is built from.
      ODIN_DOC_COMMIT: 3eb3d0cbd6b4a01b898307137fdb4854b708fe50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d # v2.12.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Install commonmark
        run: sudo apt-get update && sudo apt-get install -y libcmark-dev

      - name: Build the docs generator
        run: |
          git clone https://github.com/odin-lang/pkg.odin-lang.org.git "$RUNNER_TEMP/odin-doc-src"
          git -C "$RUNNER_TEMP/odin-doc-src" checkout "$ODIN_DOC_COMMIT"
          mkdir -p "$RUNNER_TEMP/bin"
          odin build "$RUNNER_TEMP/odin-doc-src" -out:"$RUNNER_TEMP/bin/odin-doc" -o:speed
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Generate
        run: ./scripts/build_docs.sh

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build/docs

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
