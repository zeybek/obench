name: Links

# Checks the links in the documentation every week, and on pull requests that touch it.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "**.md"
      - "scripts/odin-doc.json"
      - "lychee.toml"

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-concurrency 8 --timeout 20 './*.md' './docs/**/*.md' './scripts/odin-doc.json'
          fail: true
