name: Links

# Checks the links in the documentation every week, and on pull requests that touch it.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "**.md"
      - "scripts/odin-doc.json"

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress --max-concurrency 8 --timeout 20 './*.md' './scripts/odin-doc.json'
          fail: true
