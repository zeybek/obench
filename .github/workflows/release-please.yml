name: Release

# Opens and updates a release PR from the Conventional Commits on main and picks the next
# version from them. The PR updates CHANGELOG.md and VERSION in obench/doc.odin. Merging it
# tags the release and creates it as a draft. The CLIs are built with read-only access, and
# the last job packs them and the library folder, attests where every archive came from,
# attaches them, and publishes the release. See CONTRIBUTING.md.
#
# It runs only after CI has passed on a push to main, and only when that push is still the
# head of main: release-please reads main's current head, so a later push whose CI hasn't
# finished (or failed) must not be released on the strength of an earlier push's CI run.
#
# release-please pushes to the release PR with this workflow's token, and GitHub holds the
# pull_request runs of such pushes until a maintainer approves them. So whenever it opens or
# updates the PR, the release-pr-checks job starts CI, Lint and Links on the PR's branch with
# workflow_dispatch, which the token may still do, and their checks show on the PR.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  # Release builds use one fixed Odin release, so a tag can be built again the same way.
  ODIN_RELEASE: dev-2026-11a

jobs:
  release-please:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # release-please opens and updates the release PR, labels it, and creates the release.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Check that the tested commit is still the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head_sha="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          if [ "$head_sha" = "$TESTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main moved on to $head_sha after CI tested $TESTED_SHA; the newer push's CI run releases it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: steps.head.outputs.current == 'true'
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  release-pr-checks:
    name: Checks on the release PR
    needs: release-please
    # True when release-please opened the PR or pushed to it, not when it left it as it was.
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start CI, Lint and Links on the release PR's branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.release-please.outputs.pr }}
        run: |
          branch="$(jq -r .headBranchName <<< "$PR")"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" -f nightly=false
          gh workflow run lint.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run links.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  cli-binaries:
    name: CLI (${{ matrix.target }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-amd64 }
          - { os: windows-latest, target: windows-amd64 }
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d # v2.12.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ env.ODIN_RELEASE }}

      - name: Build
        run: |
          exe=obench
          if [ "$RUNNER_OS" = "Windows" ]; then exe=obench.exe; fi
          mkdir -p "dist/cli-$TARGET"
          scripts/build_release_cli.sh "dist/cli-$TARGET/$exe"

      # Debian 11 has glibc 2.31, older than any runner's.
      - name: The Linux CLI runs on Debian 11
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD:/w" -w /w debian:11 "dist/cli-$TARGET/obench" list examples

      # Signing and notarizing needs an Apple Developer ID; see CONTRIBUTING.md for the secrets.
      - name: Sign and notarize the macOS CLI
        if: runner.os == 'macOS' && env.APPLE_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          exe="dist/cli-$TARGET/obench"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$IDENTITY" "$exe"
          ditto -c -k "$exe" "$RUNNER_TEMP/notarize.zip"
          result="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait 2>&1)"
          echo "$result"
          echo "$result" | grep -q "status: Accepted"
          spctl -a -vv -t install "$exe"
          security delete-keychain "$keychain"

      - name: No Apple secrets, so the macOS CLI is only ad-hoc signed
        if: runner.os == 'macOS' && env.APPLE_SIGNING != 'true'
        run: echo "::notice::The macOS CLI isn't notarized because the Apple signing secrets aren't set (see CONTRIBUTING.md)."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/cli-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  # Packs every archive, attests where it came from, attaches it to the draft release, and
  # only then publishes the release, so a published release never changes.
  publish:
    name: Attest and publish
    needs: [release-please, cli-binaries]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist

      # The library folder and the five CLIs, with sorted entries, the release commit's time,
      # and no owners, so the same inputs give the same archive.
      - name: Package
        run: python3 scripts/package_release.py --tag "$TAG" --epoch "$(git log -1 --format=%ct)" --dist dist --out release

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip

      # --clobber lets a re-run replace what a failed run attached, which is safe only while
      # the release is still a draft.
      - name: Attach the archives and publish the release
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo "$TAG is already published; its assets stay as they are."
            exit 1
          fi
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false
